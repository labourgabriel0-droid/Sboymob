<section>
  <h2>Підтримка абонентів</h2>
  <p>Створіть заявку або скористайтесь голосовим меню 010.</p>
  <form id="ticketForm">
    <label>Тема
      <select name="topic">
        <option>Не реєструється в мережі</option>
        <option>Погана якість голосу</option>
        <option>Проблема з тарифом</option>
        <option>Перенесення номера MNP</option>
      </select>
    </label>
    <label>Опис
      <textarea name="details" rows="4" placeholder="Опишіть проблему"></textarea>
    </label>
    <button class="primary" type="submit">Створити заявку</button>
  </form>
  <p id="ticketOut"></p>
</section>
